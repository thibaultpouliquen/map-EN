        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;

    <body>
<div class="header">
    <h1>Project map - Thibault Pouliquen</h1>
</div>
<style>
.header {
    position: absolute;
    top: 0;
    width: 100%;
    background-color: rgba(46, 125, 50, 0.8);
    z-index: 1000; 
}

.header h1 {
    color: white;
    margin: 0;
    padding: 6px;
    text-align: center;
    font-family: Garamond;
    font-size: 18px;
}

</style>
<style>

.ol-zoom {
    top: 60px !important; /* ajuste selon la hauteur du header */
}

.ol-popup {
    position: absolute;
}

/* Contenu du popup */
#popup-content {
    line-height: 1.5;   /* espace entre les lignes */
    font-size: 14px;
}

/* Espacement entre les champs (important) */
#popup-content p {
    margin: 0px 0;
}

/* Si contenu sous forme de tableau (souvent le cas avec qgis2web) */
#popup-content table {
    border-collapse: collapse;
    width: 100%;
}

#popup-content td,
#popup-content th {
    padding: 6px 8px;
    vertical-align: middle !important;
}
#popup-content tr {
    border-bottom: 1px solid #eee; /* séparation légère */
}
/* modifier taille titre PROJECT */
#popup-content b {
    display: block;
    font-size: 16px;
    color: #2e7d32;
    margin-bottom: 6px;
}
</style>

<div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
